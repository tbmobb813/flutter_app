name: endel_clone
publish_to: 'none'
description: Generative soundscapes (Flutter + Rust Audio Engine via Method Channels)
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.5
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.0.0
  leak_tracker: ^11.0.1
  leak_tracker_testing: ^3.0.2
  leak_tracker_flutter_testing: ^3.0.10
  vm_service: ^15.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/presets/
